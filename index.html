  for(const k of MONTHS){
    if(k<it.startMonth)continue;
    const mv=state.stat.moves.filter(x=>x.item===it.id&&x.date.slice(0,7)===k);

    if(k===key)return {start,added,taken,left,counted:c==null?null:c,diff:c==null?null:c-left};
    start=c==null?left:c;
  }
  return null;
}

const tok=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,' ').split(' ').filter(x=>x.length>=3);
function sim(a,b){const A=tok(a),B=tok(b);if(!A.length)return 0;return A.filter(x=>B.some(y=>y.startsWith(x)||x.startsWith(y))).length/A.length}
const dd=(a,b)=>Math.abs((Date.parse(a)-Date.parse(b))/864e5);
function runMatch(){
  const used=new Set(),out=[];
  Object.keys(state.links).forEach(r=>used.add(r));
  for(const l of SHEET){
    const lk=Object.entries(state.links).find(([,li])=>li===l.id);
    if(lk){const r=RECEIPTS.find(x=>x.id===lk[0]);out.push({l,r,status:r.amt===l.amt?'Reconciled':'Disputed',manual:true});continue}
    const c=RECEIPTS.filter(r=>!used.has(r.id)&&dd(r.date,l.date)<=state.tol&&sim(l.vendor,r.vendor)>=state.thr)
      .sort((a,b)=>(b.amt===l.amt)-(a.amt===l.amt)||dd(a.date,l.date)-dd(b.date,l.date));
    if(c.length){const r=c[0];used.add(r.id);out.push({l,r,status:r.amt===l.amt?'Reconciled':'Disputed'})}
    else out.push({l,r:null,status:'Missing'});
  }
  const orphans=RECEIPTS.filter(r=>!used.has(r.id));
  return {out,orphans};
}

function parseCSV(text){
  const first=text.split(/\r?\n/)[0]||'',d=(first.split(';').length>first.split(',').length)?';':',';
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===d){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}
    else cur+=c}
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows;
}
function toISO(v){
  if(v instanceof Date)return isNaN(v)?'':new Date(Math.round(v/864e5)*864e5).toISOString().slice(0,10);
  if(typeof v==='number'&&v>30000)return new Date(Math.round((v-25569))*864e5).toISOString().slice(0,10);
  const s=String(v==null?'':v).trim();if(!s)return '';
  let m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/.exec(s);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  const p=Date.parse(s);if(isNaN(p))return '';const d=new Date(p);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
const toNum=v=>typeof v==='number'?v:parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''))||0;
function rowsToLines(rows){
  const norm=c=>String(c==null?'':c).trim();
  const h=rows.findIndex(r=>r.some(c=>/date/i.test(norm(c)))&&r.some(c=>/amount|amt|value|total/i.test(norm(c))));
  if(h<0)return null;
  const hdr=rows[h].map(c=>norm(c).toLowerCase()),ci=re=>hdr.findIndex(x=>re.test(x));
  const di=ci(/date/),ai=ci(/amount|amt|value|total/),ni=ci(/desc|detail|item|particular/),vi=ci(/vendor|supplier|payee|shop/);
  const lines=[];let skipped=0,other=0;
  for(const r of rows.slice(h+1)){
    const iso=toISO(r[di]),amt=toNum(r[ai]);
    if(!iso||!(amt>0)){if(r.some(c=>norm(c)))skipped++;continue}
    if(iso.slice(0,7)!==state.month){other++;continue}
    const desc=ni>=0?norm(r[ni]):'';let vendor=vi>=0?norm(r[vi]):'';
    if(!vendor){const p=desc.split(/\s[-–—]\s/);vendor=p.length>1?p[p.length-1]:desc}
    lines.push({id:uid(),date:iso,amt,desc:desc||vendor||'Petty cash',vendor:vendor||desc});
  }
  return {lines,skipped,other};
}
async function loadSheet(f){
  const m=M();if(m.locked)return toast('This month is locked');
  const ext=f.name.split('.').pop().toLowerCase();let rows=null,msg='';
  if(!['csv','xlsx','xls','pdf'].includes(ext))return toast('Use an Excel, CSV or PDF file');
  m.sheetFile={name:f.name,size:f.size,at:new Date()};
  try{
    if(ext==='csv')rows=parseCSV(await f.text());
    else if(ext==='pdf')msg='Sheet stored. PDFs are read by the server OCR in the real build, so add the lines by hand for now.';
    else{if(!window.XLSX)throw new Error('The Excel reader did not load. Try a CSV file.');
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
      rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''})}
    if(rows){
      const r=rowsToLines(rows);
      if(!r)msg='Sheet stored, but no Date and Amount columns were found. Check the header row, or add lines by hand.';
      else{m.sheet=r.lines;m.overrides={};m.links={};
        const t=r.lines.reduce((s,l)=>s+l.amt,0);
        msg='Read '+r.lines.length+' lines totalling '+NAD(t)+' for '+monthLabel(state.month)+'.'+(r.other?' '+r.other+' lines dated in other months were left out.':'')+(r.skipped?' '+r.skipped+' rows could not be read.':'')}
    }
  }catch(err){msg='Sheet stored, but it could not be read: '+err.message}
  state.shMsg=msg;render();
}

async function loadStatList(f){
  const ext=f.name.split('.').pop().toLowerCase();let rows;
  try{
    if(ext==='csv')rows=parseCSV(await f.text());
    else if(ext==='xlsx'||ext==='xls'){if(!window.XLSX)throw new Error('The Excel reader did not load. Try a CSV file.');
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''})}
    else return toast('Use an Excel or CSV file');
    const norm=c=>String(c==null?'':c).trim();
    const h=rows.findIndex(r=>r.some(c=>/item|name|description|product/i.test(norm(c)))&&r.some(c=>/qty|quantity|stock|start|opening|amount|count/i.test(norm(c))));
    if(h<0){state.stMsg='No Item and Quantity columns found. Check the header row.';return render()}
    const hd=rows[h].map(c=>norm(c).toLowerCase()),ci=re=>hd.findIndex(x=>re.test(x));
    const ni=ci(/item|name|description|product/),qi=ci(/qty|quantity|stock|start|opening|amount|count/),ui=ci(/unit|uom/);
    let created=0,topped=0,skipped=0;
    for(const r of rows.slice(h+1)){
      const name=norm(r[ni]);
      if(!name||norm(r[qi])===''){if(r.some(c=>norm(c)))skipped++;continue}
      const q=Math.max(0,Math.round(toNum(r[qi]))),ex=state.stat.items.find(i=>i.name.toLowerCase()===name.toLowerCase());
      if(ex){if(q>0)state.stat.moves.push({id:uid(),item:ex.id,date:dateFor(state.smonth),type:'add',qty:q,uid:state.user.id,note:'Stationery list upload',at:new Date()});topped++}
      else{state.stat.items.push({id:uid(),name,unit:ui>=0&&norm(r[ui])?norm(r[ui]):'pcs',open:q,startMonth:state.smonth,low:false});created++}
    }
    state.stat.items.forEach(checkLow);
    state.stMsg='Read '+(created+topped)+' items: '+created+' new, '+topped+' existing topped up.'+(skipped?' '+skipped+' rows were skipped.':'');
  }catch(err){state.stMsg='The list could not be read: '+err.message}
  render();
}

function kAfter(){

    let down=false;const pt=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
    c.onpointerdown=e=>{down=true;c.setPointerCapture&&c.setPointerCapture(e.pointerId);const [x,y]=pt(e);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+.1,y+.1);ctx.stroke()};

    if(!m.sheetFile)m.sheetFile=null;toast('Line added');render();return;
  }
  if(f==='clientForm'){const nm=$('#cName').value.trim(),rt=parseFloat($('#cRate').value)||0,er=$('#cErr');
    if(!nm)return er.textContent='Enter the client name.';
    if(rt<0)return er.textContent='Rate cannot be negative.';
    if(state.clients.some(c=>c.name.toLowerCase()===nm.toLowerCase()))return er.textContent='That client already exists.';
    state.clients.push({id:uid(),name:nm,rate:rt,bill:$('#cBill').value==='1'});logA('Client added',nm+' at N$ '+rt+'/h');toast(nm+' added');render();return}
  if(f==='timeForm'){const h=parseFloat($('#tHrs').value);if(!(h>0))return toast('Enter hours');
    D().entries.push({day:'Sat 24 Oct',client:$('#tClient').value,task:$('#tTask').value||'Work',hrs:h,status:'Draft'});queue();toast('Entry added');render()}
  if(f==='leaveForm'){
    const c=leaveCalc(),d=D(),err=$('#lErr'),reason=$('#lReason').value.trim(),file=$('#lFile').files[0];
    const bal=d.leaveBal.find(b=>b[0]===c.type);
    let m='';
    if(!c.from||!c.to)m='Choose the first and last day.';
    else if(c.to<c.from)m='The last day cannot be before the first day.';
    else if(!c.days)m='Those dates have no working days.';
    else if(bal&&c.days>bal[1])m='You only have '+bal[1]+' '+c.type.toLowerCase()+' days left.';
    else if(d.leaves.some(l=>(l.status==='Pending'||l.status==='Approved')&&!(c.to<l.from||c.from>l.to)))m='These dates overlap another application.';
    else if(c.type==='Sick'&&c.days>2&&!file)m='Attach a doctor\'s note for sick leave over 2 days.';
    else if(reason.length<3)m='Give a short reason.';
    else if(!$('#lDecl').checked)m='Tick the confirmation to send.';
    if(m){err.textContent=m;return}
    const l={id:uid(),type:c.type,from:c.from,to:c.to,days:c.days,reason,cover:$('#lCover').value.trim(),phone:$('#lPhone').value.trim(),file:file?file.name:'',status:'Pending'};
    d.leaves.unshift(l);
    state.approvals.push({id:uid(),uid:state.user.id,type:'Leave',who:state.user.name,kind:'leave',obj:l,status:'Pending',
      detail:c.type+' leave, '+fmtD(c.from)+' to '+fmtD(c.to)+', '+c.days+' day'+(c.days===1?'':'s')+'. Reason: '+reason+(l.cover?'. Cover: '+l.cover:'')});
    queue();toast('Leave application sent');render();
  }
  if(f==='loanForm'){const amt=parseFloat($('#aAmt').value),m=parseInt($('#aMon').value);if(!(amt>0&&m>0))return toast('Check amount and months');
    const l={label:'Advance '+NAD(amt)+' over '+m+' months',amount:amt,paid:0,per:amt/m,status:'Pending'};D().loans.push(l);
    state.approvals.push({id:uid(),uid:state.user.id,type:'Loan',who:state.user.name,kind:'loan',obj:l,detail:'Salary advance '+NAD(amt)+' over '+m+' months',status:'Pending'});queue();toast('Advance request sent');render()}
  if(f==='empForm'){
    const name=$('#nName').value.trim(),email=$('#nEmail').value.trim().toLowerCase(),pw=$('#nPass').value,err=$('#nErr');
    let m='';
    if(name.length<2)m='Enter the full name.';
    else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))m='Enter a valid email address.';
    else if(state.users.some(u=>u.email.toLowerCase()===email))m='That email already has an account.';
    else if(pw.length<8||!/\d/.test(pw))m='Temporary password needs 8 or more characters with a number.';
    if(m){err.textContent=m;return}
    const type=$('#nRole').value,id=uid();
    const u=mk(id,type,name,$('#nTitle').value.trim()||(type==='admin'?'Administrator':'Employee'),email,pw,
      {access:$('#nAccess').checked,mustChange:$('#nMust').checked,base:type==='emp'?(+$('#nBase').value||0):0,allow:type==='emp'?(+$('#nAllow').value||0):0});
    state.users.push(u);state.data[id]={entries:[],leaveBal:DEF_BAL(),leaves:[],loans:[]};logA('Employee added',name+' ('+type+')');
    state.newCred={name,email,password:pw,mustChange:u.mustChange};
    toast(name+' added');render();window.scrollTo(0,0);
  }
});
document.addEventListener('input',e=>{
  const sf=e.target.closest&&e.target.closest('form.settle');
  if(sf){const a=state.advances.find(x=>x.id===sf.id.slice(7)),sp=sf.elements.spent.value===''?null:Math.round(+sf.elements.spent.value*100)/100,box=$('#calc-'+a.id);
    if(sp===null)box.textContent='Enter what was spent to see the change due back.';
    else if(sp>a.amount)box.textContent='Spent is more than the amount taken.';
    else{const exp=Math.round((a.amount-sp)*100)/100;box.textContent='Change due back: '+NAD(exp)+(sf.elements.ret.value===''?'':Math.round((+sf.elements.ret.value-exp)*100)/100===0?'. Matches.':'. Difference: '+NAD(Math.round((+sf.elements.ret.value-exp)*100)/100))}}
  if(e.target.id==='tol'){state.tol=+e.target.value;$('#tolV').textContent='+/- '+state.tol+' days';$('#pcResults').innerHTML=pcResults()}
  if(e.target.id==='thr'){state.thr=+e.target.value/100;$('#thrV').textContent=e.target.value+'%';$('#pcResults').innerHTML=pcResults()}
  if(e.target.closest&&e.target.closest('#leaveForm'))leaveSummary();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='sgFile'){loadSig(t.files[0]);t.value='';return}
  if(t.dataset&&t.dataset.rate){const c=state.clients.find(x=>x.id===t.dataset.rate),v=parseFloat(t.value);if(c&&v>=0){c.rate=v;toast('Rate updated');render()}else toast('Enter a valid rate');return}
  if(t.id==='smSel'){state.smonth=t.value;state.stMsg='';return render()}
  if(t.id==='stFile'){if(t.files[0])loadStatList(t.files[0]);t.value='';return}
  if(t.dataset&&t.dataset.cnt){
    const k=state.smonth,c=state.stat.counts[k]||(state.stat.counts[k]={}),id=t.dataset.cnt;
    if(t.value==='')delete c[id];else c[id]=Math.max(0,Math.round(+t.value));
    const s=stock(state.stat.items.find(i=>i.id===id),k);
    $('#df-'+id).textContent=s.diff==null?'-':s.diff===0?'0':sg(s.diff);$('#stSum').innerHTML=stSummary(k);return;
  }
  if(t.id==='mSel'){state.month=t.value;state.shMsg='';return render()}
  if(t.id==='rcFile'){addReceipts([...t.files]);t.value='';return}
  if(t.id==='shFile'){if(t.files[0])loadSheet(t.files[0]);t.value='';return}
  if(t.id==='opening'){M().opening=Math.max(0,parseFloat(t.value)||0);return render()}
  if(t.dataset&&t.dataset.rid){const r=M().receipts.find(x=>x.id===t.dataset.rid),k=t.dataset.f;if(!r)return;r[k]=k==='amt'?(parseFloat(t.value)||0):t.value;if($('#rcTotals'))$('#rcTotals').innerHTML=rcSummary();return}
  if(t.closest&&t.closest('#leaveForm'))leaveSummary();
});
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();const z=e.target.closest&&e.target.closest('.drop');document.querySelectorAll('.drop.over').forEach(x=>{if(x!==z)x.classList.remove('over')});if(z)z.classList.add('over')}));
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('.drop');if(z&&!z.contains(e.relatedTarget))z.classList.remove('over')});
document.addEventListener('drop',e=>{e.preventDefault();document.querySelectorAll('.drop.over').forEach(x=>x.classList.remove('over'));
  const z=e.target.closest&&e.target.closest('.drop');if(!z||!e.dataTransfer)return;const fs=[...e.dataTransfer.files];if(!fs.length)return;
  if(z.id==='rcDrop')addReceipts(fs);else if(z.id==='shDrop')loadSheet(fs[0]);else if(z.id==='stDrop')loadStatList(fs[0]);else if(z.id==='sgDrop')loadSig(fs[0])});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('drop')){e.preventDefault();$('#'+e.target.dataset.input).click()}});
setInterval(()=>{if(state.user&&state.online)state.user.beat=Date.now();if(state.user&&state.role==='adm'&&state.tab.adm==='activity')render()},30000);
render();
